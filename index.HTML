<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="culturama-favico.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans&display=swap" rel="stylesheet">

    <title>Pesquisa Culturama</title>
</head>
    <body>
        <main>
    
        <header>
        <img src="img/logo-culturama.png" alt="Logo Culturama">
        <h1>Pesquisa Online</h1>
    </header>
<section>
<form action="sucesso.html" method="get">

 <fieldset>

        <legend>Dados Pessoais</legend>

        <label for="userName">Nome</label>
        <input type="text" name="userName" required><br>
    
        <label for="userAge">Idade</label>
        <input type="number" name="userAge" min = 12 max = 100 required><br>
    
        <label for="birthdate">Data de Nascimento</label>
        <input type="date" name="birthdate"><br>
    
        <label for="userEmail">Email</label>
        <input type="email" name="userEmail" required><br>
    
        <label for="userNumberPhone">Telefone</label>
        <input type="tel" name="userNumberPhone" pattern="[0-9]{11}" placeholder="DDD + número sem espaço ou hífen" aria-describedby="phoneHelp">
        <small id="phoneHelp">Preencha com 11 dígitos no formato: DDD + número sem espaços ou hífen.</small><br>
    
        <label for="userImage">Upload de foto</label>
        <input type="file" name="userImage" accept="image/*" aria-describedby="imageHelp">
        <small id="imageHelp">Escolha uma imagem no formato JPG ou PNG.</small>
    
    </fieldset>


    <fieldset>
        <legend>Perfil</legend>
        
        <label for="userGender">Gênero</label><br>
        
        <input type="radio" name="userGender" value="Masculino">
        <label for="male">Masculino</label>
        <input type="radio" name="userGender" value="Feminino">
        <label for="female">Feminino</label>
        <input type="radio" name="userGender" value="Outro">
        <label for="other">Outro</label><br>
        
         <label for="maritalStatus">Estado Civil</label>
        <select name="maritalStatus"> 
           <option value="not" disabled selected>Selecionar</option>
           <option value="Solteiro">Solteiro</option>
           <option value="Casado">Casado</option>
           <option value="Divorciado">Divorciado</option>
           <option value="Viúvo">Viúvo</option>
         
        </select>
        <section>
        <label for="userState">Estado</label>
        <select name="userState" id="userState">
              <option value="not" disabled selected>Selecionar</option>
              <option value="AC">AC</option>
              <option value="AL">AL</option>
              <option value="AP">AP</option>
              <option value="AM">AM</option>
              <option value="BA">BA</option>
              <option value="CE">CE</option>
              <option value="DF">DF</option>
              <option value="ES">ES</option>
              <option value="GO">GO</option>
              <option value="MA">MA</option>
              <option value="MT">MT</option>
              <option value="MS">MS</option>
              <option value="MG">MG</option>
              <option value="PA">PA</option>
              <option value="PB">PB</option>
              <option value="PR">PR</option>
              <option value="PE">PE</option>
              <option value="PI">PI</option>
              <option value="RJ">RJ</option>
              <option value="RN">RN</option>
              <option value="RS">RS</option>
              <option value="RO">RO</option>
              <option value="RR">RR</option>
              <option value="SC">SC</option>
              <option value="SP">SP</option>
              <option value="SE">SE</option>
              <option value="TO">TO</option><br>
           
        </select>
         <section>           
           
             <label for="userCity">Cidade</label>
              <input type="text" name="userCity" placeholder="Ex: São Paulo">
              
          </section>
    </fieldset> 


<fieldset>
    <legend>Hábitos</legend>
    <p>Redes Sociais:</p>
    <input type="checkbox" name="socialMedia" value="facebook" id="facebook" >
    <label for="facebook">Facebook</label><br>
    
    <input type="checkbox" name="socialMedia" value="instagram" id="instagram">
    <label for="instagram">Instagram</label><br>
    
    <input type="checkbox" name="socialMedia" value="x" id="twitter">
    <label for="twitter">X</label><br>
    
    <input type="checkbox" name="socialMedia" value="linkedin" id="linkedin">
    <label for="linkedin">LinkedIn</label><br>

    
    <label for="styleMusic">Estilo Musical</label>
    <input list="styleTypes" id="styleMusic" name="userMusicStyle" type="text" >
    <datalist id="styleTypes">
        <option value="Rock">
        <option value="Pop">
        <option value="Eletrônica">
        <option value="Samba">
    </datalist><br>
    

    <label for="colorFavorite">Cor Favorita</label>
    <input type="color" id="colorFavorite" name="userColor">


</fieldset>

<fieldset>

    <legend>Opinião</legend>
    
    <p>O que você achou da qualidade do nosso serviço?</p>

    <input type="radio" name="userOpinion" value="otimo" id="excellent">
    <label for="excellent">Òtimo</label>

    <input type="radio" name="userOpinion" value="Bom" id="good">
    <label for="good">Bom</label>

    <input type="radio" name="userOpinion" value="Regular" id="regular">
    <label for="regular">Regular</label>

    <input type="radio" name="userOpinion" value="Ruim" id="bad">
    <label for="bad">Ruim</label><br>

    

    <label for="opinion">Comentário:</label>
    <textarea id="opinion" name="userOpinion" placeholder="Digite sua opinião aqui..."></textarea>



</fieldset>

<fieldset>
    <legend>Confirmações</legend>

    <input type="checkbox" name="userLgpd" value="confirm" id="userLgpdTerm" required>
    <label for="userLgpdTerm">Eu aceito participar da pesquisa.</label><br>

    <input type="checkbox" name="userGetResult" value="confirm" id="getResult" required>
    <label for="getResult">Desejo receber email com os resultados.</label>


</fieldset>

    <button type="submit" aria-label="Enviar dados do formulário">Enviar</button>
    <button type="reset" aria-label="Limpar formulário">Limpar</button>

</form>

</section>
    
        </main>
    </body>
</html>
