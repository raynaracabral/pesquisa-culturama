<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Culturama</title>
</head>
<body>
    <header>
        <h1>Pesquisa Online</h1>
    </header>
<section>
<form action="" method="get">
    <fieldset>
    <!-- dados pessoais -->
<legend>Dados Pessoais</legend>

    <label for="userName">Nome</label>
    <input type="text" name="userName" required>
<br>
    <label for="userAge">Idade</label>
    <input type="number" name="userAge" min = 12 max = 100 required>
<br>
    <label for="birthdate">Data de Nascimento</label>
    <input type="date" name="birthdate">
<br>
    <label for="userEmail">Email</label>
    <input type="email" name="userEmail" required>
<br>
    <label for="userNumberPhone">Telefone</label>
    <input type="tel" name="userNumberPhone" pattern="[0-9]{11}" placeholder="DDD = número sem espaço ou hífen">
<br>
    <label for="userImage">Upload de foto</label>
    <input type="file" name="userImage" accept="image/*">
    </fieldset>

    <fieldset>
        <legend>Perfil</legend>
        <p>Gênero:</p>
        <input type="radio" name="userGender" value="Masculino" id="male">
        <label for="male">Masculino</label>
        <input type="radio" name="userGender" value="Feminino" id="female">
        <label for="female">Feminino</label>
        <input type="radio" name="userGender" value="Outro" id="other">
        <label for="other">Outro</label>
        <br>

        <label for="maritalStatus">Estado Civil</label>
        <select name="maritalStatus" id="maritalStatus">
           <option value="Solteiro">Solteiro</option>
           <option value="Casado">Casado</option>
           <option value="Divorciado">Divorciado</option>
           <option value="Viúvo">Viúvo</option>






        </select>

    </fieldset>


    <button type="submit">Enviar</button>

</form>




</section>
</body>
</html>
